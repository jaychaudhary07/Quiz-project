<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ-APPLICATION</title>

    <!-- custom css -->
    <link rel="stylesheet" href="./style.css">

    <!-- media css -->
    <link rel="stylesheet" href="./media.css">

    <!-- bootstrap css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- remixicon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

</head>

<body class="bg-primary">

    <header>
        <div class="container">
            <div class="row">
                <div class="head">
                    <div class="col-12">
                        <nav class="navbar align-items-center border-bottom">
                            <div class="col-lg-2 col-4">
                                <div class="logo">
                                    <img src="./image/logo.png" alt="" class="img-fluid">
                                </div>
                            </div>
                            <div class="col-4 d-none d-lg-block">
                                <div class="navigation">
                                    <ul class="list-unstyled d-flex justify-content-between">
                                        <li class="m-0">Home </li>
                                        <li class="m-0">Quiz</li>
                                        <li class="m-0">Leaderboard</li>
                                        <li class="m-0">About</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="col-3 col-lg-2">
                                <div class="start start-xs text-end">
                                    <a href="#start-quiz">
                                        <button class="btn border rounded-pill bg-success text-light">
                                            Start Quiz <span><i class="ri-arrow-right-long-line"></i></span>
                                        </button>
                                    </a>
                                </div>
                            </div>

                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>

        <!-- quiz intruction -->
        <section class=" pt-5" id="banner-sec">
            <div class="container">
                <div class="row">
                    <div class="quiz ">
                        <div class="col-12">
                            <div class="quiz-sec d-flex flex-column flex-lg-row justify-content-between align-items-center">
                                <div class="col-8 col-lg-4">
                                    <div class="quiz-img">
                                        <img src="" alt="" class="img-fluid " id="image">
                                    </div>
                                </div>
                                <div class="col-12 col-lg-8">

                                    <div class="quiz-content p-5">
                                        <div class="col-4 col-lg-3 col-xxl-2">
                                            <div class="rounded-4 py-2 bg-success text-center text-light">
                                                Cricket Legends
                                            </div>
                                        </div>
                                        <h2 class="pt-3 display-5 fw-bold" id="title">
                                            <!-- Cricket Legends Quiz's -->
                                        </h2>
                                        <p class="font-xs pt-2 fs-4 " id="desc">
                                            <!-- how well do you know the legend of cricket? from kohli to sachin, test your
                                            knowledge about the greatest players, iconic moments and unforgettable
                                            records! -->
                                        </p>
                                        <div class="intruction d-flex justify-content-between justify-content-lg-around pt-4">
                                            <div class="question d-flex align-items-center gap-2">
                                                <div class="fs-1">
                                                    <i class="ri-question-fill"></i></span>
                                                </div>
                                                <div>
                                                    <p>Total Question</p>
                                                    <p class="fun fw-bold" id="question">
                                                        <!-- 10 -->
                                                    </p>
                                                </div>
                                            </div>
                                            <div class="time">
                                                <div class="question d-flex align-items-center gap-2">
                                                    <div class="fs-1">
                                                        <span><i class="ri-alarm-line"></i></span>
                                                    </div>
                                                    <div>
                                                        <p>Time Limit</p>
                                                        <p class="fun fw-bold" id="time">
                                                            Sec
                                                            <!-- 10 Minutes -->
                                                            <span id="time">

                                                            </span>
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="difficulty">
                                                <div class="question d-flex align-items-center gap-2">
                                                    <div class="fs-1">
                                                        <span><i class="ri-bar-chart-fill"></i></span>
                                                    </div>
                                                    <div>
                                                        <p>Difficulty</p>
                                                        <p class="fun fw-bold">Medium</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="start pt-5 d-flex justify-content-center" id="quiz-btn">
                                            <button class="btn border rounded-pill bg-success  text-light px-5 py-3">
                                                Start Quiz <span><i class="ri-arrow-right-long-line"></i></span>
                                            </button>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- question pages -->
        <section class="d-none mt-5 " id="que-sec">
            <div class="container">
                <div class="row">
                    <div class="quiz-question">
                        <div class="col-12 col-lg-9 mx-auto">
                            <div class="que border p-3">
                                <div class="complete-que d-flex justify-content-center align-items-center">
                                    <div class="col-8 ">
                                        <p>Question
                                            <span id="current-que">
                                                <!-- 0 -->
                                            </span> of
                                            <span id="total-que">
                                                <!-- 10 -->
                                            </span>
                                        </p>
                                        <div class="progress" role="progressbar" aria-label="Basic example"
                                            aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                            <div class="progress-bar" id="progress"></div>
                                        </div>
                                    </div>
                                    <div class="col-4 col-lg-3">
                                        <div class="timer d-flex gap-2 justify-content-end ">
                                            <span><i class="ri-timer-line"></i></span>
                                            <p>Time Left :
                                                <span id="remain">
                                                    
                                                </span>
                                            </p>
                                        </div>
                                    </div>

                                </div>
                                <div class="col-10 mx-auto">
                                    <div class="que-list border rounded-4 py-5 mt-5">
                                        <div class="question-card text-center">
                                            <p>
                                                Attempted
                                                <span id="total-atempt">
                                                    0
                                                </span>
                                                of
                                                <span id="Attempted-que">

                                                </span>
                                            </p>
                                            <h3 class="" id="quiz-que">
                                                <!-- Which player is known as "king" ? -->
                                            </h3>
                                            <div class="col-10 mx-auto">
                                                <div class="opt mt-4">

                                                </div>
                                            </div>
                                        </div>
                                        <div class="que-btn d-flex justify-content-between pt-5">
                                            <div class="skip-btn px-2">
                                                <button class="btn border bg-success px-2 text-light ">
                                                    Previous
                                                </button>
                                            </div>
                                            <div class="px-2 ">
                                                
                                                <button class="btn border bg-success text-light" id="next-btn">
                                                    <!-- Next<i class="ri-arrow-right-line"></i> -->
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- score page -->
        <section class="d-none mt-4" id="score-sec">
            <div class="container">
                <div class="row">
                    <div class="score-sec">
                        <div class="col-12">
                            <div class="score">
                                <div class="quiz-com d-flex  flex-column align-items-center">

                                    <div class="col-6 col-lg-3 pb-3">

                                        <div class="text-center">
                                            <img src="./image/gif.gif" alt="" class="w-50">
                                        </div>
                                    </div>

                                    <h2>Quiz Completed!</h2>
                                    <p>
                                        You did it, <span class="text-success">Cricketeer!</span>
                                    </p>
                                </div>


                                <div class="bg-secondary">
                                    <div class="your-score text-center pt-5">
                                        <p class="m-0">
                                            Total Attempt
                                        </p>
                                        <p class="m-0 fw-bold fs-3">
                                            <span id="Attempt">

                                            </span>
                                            /
                                            <span id="totl-atempt">

                                            </span>
                                        </p>
                                    </div>
                                    <div class="result-sec d-flex justify-content-center gap-5 mt-4  py-5">
                                    
                                    <div class="col-3 col-lg-1">
                                        <div class="correct border rounded-4 p-2 text-center">
                                            <span><i class="ri-checkbox-circle-line"></i></span>
                                            <p class="fw-bold">RIGHT</p>
                                            <p class="fw-bold fs-4" id="rightOpt"></p>
                                           
                                        </div>
                                    </div>
                                    <div class="col-3 col-lg-1">
                                        <div class="wrong border rounded-4 p-2 text-center">
                                            <span><i class="ri-close-circle-line"></i></span>
                                            <p class="fw-bold">WRONG</p>
                                            <p class="fw-bold fs-4" id="wrongOpt"></p>
                                            
                                        </div>
                                    </div>
                                    <div class="col-3 col-lg-1  ">
                                        <div class="skiped border rounded-4 p-2 text-center">
                                            <span><i class="ri-skip-forward-line"></i></span>
                                            <p class="fw-bold">SKIPPED</p>
                                            <p class="fw-bold fs-4" id="skip">10</p>
                                            
                                        </div>
                                    </div>
                                </div>
                                </div>
                                <div class="play-again text-center mt-4">
                                    <button class="btn border rounded-pill bg-success text-light px-4 py-2 me-5"
                                        id="play-btn">
                                        Play Again <span><i class="ri-issues-reopen-line"></i></span>
                                    </button>
                                    <button class="btn border rounded-pill bg-success text-light px-4 py-2"
                                        id="home-btn">
                                        Home<span><i class="ri-home-3-line"></i></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- data js -->
    <script src="./quiz-data.js"></script>

    <!-- javascript -->
    <script src="./script.js"></script>

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
